# Reverse proxy block for a hosted kilazi-live (nginx in the same docker network).
server {
    listen 443 ssl;
    server_name live.example.com;
    ssl_certificate     /etc/letsencrypt/live/live.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.example.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 16m;
    location / {
        set $kl http://kilazi-live:4321;
        proxy_pass $kl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
